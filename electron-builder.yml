appId: com.minwoo.diffdesk
productName: DiffDesk
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
npmRebuild: false
win:
  icon: build/icon.ico
  artifactName: DiffDesk-fast-start.${ext}
  target:
    - target: dir
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
portable:
  artifactName: DiffDesk-portable.exe
  # NSIS's zlib path avoids the slower embedded 7z extraction on every launch.
  useZip: true
