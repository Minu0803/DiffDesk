appId: com.minwoo.diffdesk
productName: DiffDesk
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: node_modules/monaco-editor/LICENSE
    to: licenses/Monaco-LICENSE.txt
  - from: node_modules/react/LICENSE
    to: licenses/React-LICENSE.txt
  - from: node_modules/react-dom/LICENSE
    to: licenses/ReactDOM-LICENSE.txt
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: DiffDesk-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  packElevateHelper: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
